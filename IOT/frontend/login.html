<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In / Register - Health Monitoring System</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- NAVIGATION BAR -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="brand-logo">
                <div class="brand-icon">🏥</div>
                <span>HealthPulse IoT</span>
            </a>
            <ul class="nav-links">
                <li><a href="index.html" class="nav-link">Home</a></li>
                <li><a href="about.html" class="nav-link">About</a></li>
                <li><a href="contact.html" class="nav-link">Contact</a></li>
                <li><a href="api.html" class="nav-link">API</a></li>
                <li><a href="dashboard.html" class="nav-link">Dashboard</a></li>
            </ul>
            <div id="nav-auth-container">
                <a href="login.html" class="nav-link btn-nav-primary active">Sign In</a>
            </div>
        </div>
    </nav>

    <!-- MAIN AUTH CONTAINER -->
    <main class="main-content">
        <div class="auth-container">
            <div class="auth-header">
                <h2>User Authentication</h2>
                <p>Sign in or create account via OTP Verification</p>
            </div>

            <!-- TAB TOGGLES -->
            <div style="display: flex; background: var(--surface-bg); border-radius: var(--radius-md); padding: 4px; margin-bottom: 1.8rem; border: 1px solid var(--border-color);">
                <button id="tab-login" class="btn" style="flex: 1; padding: 8px; font-size: 0.9rem; background: var(--card-bg); color: #fff;">Sign In</button>
                <button id="tab-register" class="btn" style="flex: 1; padding: 8px; font-size: 0.9rem; background: transparent; color: var(--text-muted);">Register</button>
            </div>

            <!-- DEMO OTP DISPLAY BANNER -->
            <div id="demo-otp-banner" style="display: none; background: rgba(16, 185, 129, 0.15); border: 1px solid rgba(16, 185, 129, 0.4); border-radius: var(--radius-md); padding: 12px; text-align: center; margin-bottom: 1.5rem; font-size: 0.9rem;">
            </div>

            <!-- STEP 1: MOBILE / EMAIL INPUT FORM -->
            <form id="login-step-form">
                <div class="form-group" id="name-group" style="display: none;">
                    <label class="form-label" for="name-input">Full Name</label>
                    <input type="text" id="name-input" class="form-control" placeholder="Enter patient / user name">
                </div>

                <div class="form-group">
                    <label class="form-label" for="identifier-input">Mobile Number or Gmail</label>
                    <input type="text" id="identifier-input" class="form-control" placeholder="e.g. 9876543210 or rahul@gmail.com" required>
                </div>

                <button type="submit" id="auth-submit-btn" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">
                    Generate OTP
                </button>
            </form>

            <!-- STEP 2: OTP VERIFICATION FORM -->
            <form id="otp-step-form" style="display: none;">
                <p style="text-align: center; font-size: 0.9rem; color: var(--text-muted); margin-bottom: 1rem;">
                    Enter the 6-digit security OTP code generated for your account.
                </p>

                <div class="otp-box-group">
                    <input type="text" maxlength="1" class="otp-input" required>
                    <input type="text" maxlength="1" class="otp-input" required>
                    <input type="text" maxlength="1" class="otp-input" required>
                    <input type="text" maxlength="1" class="otp-input" required>
                    <input type="text" maxlength="1" class="otp-input" required>
                    <input type="text" maxlength="1" class="otp-input" required>
                </div>

                <div class="otp-timer">
                    Resend OTP in <span id="timer-seconds" style="font-weight: 700; color: #fff;">60</span>s
                    <br>
                    <button type="button" id="resend-otp-btn" class="resend-btn" disabled>Resend Code</button>
                </div>

                <button type="submit" id="otp-verify-btn" class="btn btn-primary" style="width: 100%;">
                    Verify OTP & Login
                </button>
            </form>
        </div>
    </main>

    <footer class="footer">
        <div class="footer-container">
            <div>HealthPulse IoT Monitoring System &copy; 2026</div>
            <div>OTP Verification Module</div>
        </div>
    </footer>

    <script src="js/main.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
