services:
  - type: web
    name: dipueditx-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: FORMSUBMIT_EMAIL
        value: dipusah7481@gmail.com
      - key: KEEP_ALIVE_URL
        sync: false
